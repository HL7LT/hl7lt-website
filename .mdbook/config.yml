site:
  title: HL7 Lithuania Registry
  description: National HL7® FHIR® Implementation Guide Registry for Lithuania
  lang: en
  url: https://hl7.lt
  base: /

source:
  format: owliki        # Owliki wiki layout: space.json + pages.json + source/pages/*.md
  meta: source          # space.json + pages.json + attachments/ live under source/
  pages: source/pages   # page markdown, one file per language content (by slug)

theme:
  skin: hl7lt

search: true

# Top navigation (mirrors the source site's menu).
nav:
  - text: Home
    link: /
  - text: Builds
    link: /build
  - text: Terminology
    link: /terminology
  - text: Community
    link: /community

# Lithuanian menu (TermX uses per-language slugs, so LT routes differ from EN).
locales:
  lt:
    label: Lietuvių
    nav:
      - text: Pradžia
        link: /lt/
      - text: Versijos
        link: /lt/versijos
      - text: Terminologija
        link: /lt/terminologija
      - text: Bendruomenė
        link: /lt/bendruomene

# Site footer, shown on every page.
footer:
  message: Open source · Collaborative · Interoperable
  copyright: >-
    © 2026 HL7 Lithuania Registry · Maintained by
    <a href="https://github.com/HL7LT">HL7 Lithuania</a>

build:
  out: .mdbook/dist
